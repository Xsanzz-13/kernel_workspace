name: Membangun DTBS

on:
  workflow_dispatch:

jobs:
  build-dtbs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache \
            python3-minimal \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            libyaml-dev \
            pkg-config \
            device-tree-compiler

      - name: Setup Toolchain
        run: |
          echo "${GITHUB_WORKSPACE}/toolchain/clang-r383902/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/toolchain/aarch64-linux-android-4.9/bin" >> "$GITHUB_PATH"

      - name: Setup Environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "BSP_BUILD_FAMILY=sharkl3" >> "$GITHUB_ENV"
          echo "BSP_BUILD_ANDROID_OS=y" >> "$GITHUB_ENV"
          echo "BSP_BUILD_DT_OVERLAY=y" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_TEST_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_apply_overlay" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_VTS_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_verify_overlay_host" >> "$GITHUB_ENV"

      - name: Check Toolchain
        run: |
          clang --version
          aarch64-linux-gnu-gcc --version
          pkg-config --modversion yaml-0.1
          pkg-config --libs yaml-0.1

      - name: Generate Kernel Config
        run: |
          mkdir -p out

          make O=out \
            CC=clang \
            LD=ld.lld \
            BSP_BUILD_DT_OVERLAY=y \
            a3core_eur_open_defconfig

           - name: Patch DTC libyaml
       run: |
          echo "===== BEFORE ====="
          grep -n -E 'HOSTLDLIBS_dtc|yamltree|yaml' scripts/dtc/Makefile || true

          printf '\nHOSTLDLIBS_dtc += -lyaml\n' >> scripts/dtc/Makefile

          echo "===== AFTER ====="
          tail -20 scripts/dtc/Makefile

            - name: Build DTBS
        run: |
          echo "===== YAML CHECK ====="
          pkg-config --exists yaml-0.1
          echo "yaml version:"
          pkg-config --modversion yaml-0.1
          echo "yaml cflags:"
          pkg-config --cflags yaml-0.1
          echo "yaml libs:"
          pkg-config --libs yaml-0.1

          echo "===== LIBYAML CHECK ====="
          ldconfig -p | grep yaml || true
          nm -D /usr/lib/x86_64-linux-gnu/libyaml-0.so.2 | grep yaml_emitter_emit || true

          echo "===== DTC MAKEFILE ====="
          grep -n -E 'yaml|HOSTLDLIBS_dtc|yamltree' scripts/dtc/Makefile || true

          echo "===== CLEAN OLD DTC ====="
          rm -rf out/scripts/dtc

          echo "===== BUILD DTBS ====="
          make -j2 V=1 O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            BSP_BUILD_DT_OVERLAY=y \
            HOSTLDLIBS_dtc=-lyaml \
            dtbs

      - name: Collect DTBS
        run: |
          mkdir -p output_artifacts

          find out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec cp {} output_artifacts/ \;

      - name: Upload DTBS
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-DTBS
          path: output_artifacts/*