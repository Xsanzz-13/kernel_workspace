name: Membangun DTBS

on:
  workflow_dispatch:

jobs:
  build-dtbs:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache \
            python3-minimal \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            libyaml-dev \
            pkg-config \
            device-tree-compiler

      - name: Setup Toolchain
        run: |
          echo "${GITHUB_WORKSPACE}/toolchain/clang-r383902/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/toolchain/aarch64-linux-android-4.9/bin" >> "$GITHUB_PATH"

      - name: Setup Environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "BSP_BUILD_FAMILY=sharkl3" >> "$GITHUB_ENV"
          echo "BSP_BUILD_ANDROID_OS=y" >> "$GITHUB_ENV"
          echo "BSP_BUILD_DT_OVERLAY=y" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_TEST_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_apply_overlay" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_VTS_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_verify_overlay_host" >> "$GITHUB_ENV"

      - name: Check Toolchain
        run: |
          clang --version
          aarch64-linux-gnu-gcc --version
          pkg-config --modversion yaml-0.1
          pkg-config --libs yaml-0.1

      - name: Generate Kernel Config
        run: |
          mkdir -p out

          make O=out \
            CC=clang \
            LD=ld.lld \
            BSP_BUILD_DT_OVERLAY=y \
            a3core_eur_open_defconfig

      - name: Build DTBS
        run: |
          rm -rf out/scripts/dtc

          make -j2 O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            BSP_BUILD_DT_OVERLAY=y \
            HOSTLDLIBS_dtc="$(pkg-config --libs yaml-0.1)" \
            dtbs

      - name: Collect DTBS
        run: |
          mkdir -p output_artifacts

          find out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec cp {} output_artifacts/ \;

      - name: Upload DTBS
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-DTBS
          path: output_artifacts/*