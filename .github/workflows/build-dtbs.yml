name: Build DTBS

on:
  workflow_dispatch:

jobs:
  build-dtbs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            pkg-config \
            device-tree-compiler \
            libc++-dev \
            libc++abi-dev \
            python3 \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            tar

      - name: Setup Toolchain
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang-r383902/bin:${GITHUB_WORKSPACE}/toolchain/aarch64-linux-android-4.9/bin:$PATH"

          echo "PATH=${PATH}" >> "$GITHUB_ENV"

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "BSP_BUILD_FAMILY=sharkl3" >> "$GITHUB_ENV"
          echo "BSP_BUILD_ANDROID_OS=y" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_TEST_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_apply_overlay" >> "$GITHUB_ENV"
          echo "DTC_OVERLAY_VTS_EXT=${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_verify_overlay_host" >> "$GITHUB_ENV"

          clang --version
          gcc --version

      - name: Inspect mkdtimg
        run: |
          chmod +x tools/mkdtimg/mkdtimg

          echo "===== mkdtimg ====="
          file tools/mkdtimg/mkdtimg
          ldd tools/mkdtimg/mkdtimg || true

          echo "===== HELP ====="
          tools/mkdtimg/mkdtimg help 2>&1 || true

          echo "===== CREATE USAGE ====="
          tools/mkdtimg/mkdtimg create 2>&1 || true

          echo "===== STRINGS ====="
          strings tools/mkdtimg/mkdtimg | \
            grep -iE 'usage|create|build|dtbo|page|entry|id|rev|custom' | \
            head -100

      - name: Verify LibYAML
        run: |
          pkg-config --cflags yaml-0.1
          pkg-config --libs yaml-0.1

          cat > /tmp/test_yaml.c <<'EOF'
          #include <yaml.h>

          int main(void)
          {
              yaml_emitter_t emitter;
              yaml_emitter_initialize(&emitter);
              yaml_emitter_delete(&emitter);
              return 0;
          }
          EOF

          gcc /tmp/test_yaml.c -lyaml -o /tmp/test_yaml
          /tmp/test_yaml

      - name: Prepare Defconfig
        run: |
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            BSP_BUILD_DT_OVERLAY=y \
            a3core_eur_open_defconfig

      - name: Fix DTC LibYAML Link
        run: |
          cat >> scripts/dtc/Makefile <<'EOF'

          # Fix libyaml linking for old 4.14 Kbuild
          HOSTLOADLIBES_dtc := -lyaml
          EOF

          echo "===== DTC MAKEFILE ====="
          tail -n 15 scripts/dtc/Makefile

      - name: Set Execute Permission
        run: |
          chmod +x tools/mkdtimg/ufdt_apply_overlay
          chmod +x tools/mkdtimg/ufdt_verify_overlay_host

          echo "===== OVERLAY TOOLS ====="
          ls -l tools/mkdtimg/ufdt_apply_overlay
          ls -l tools/mkdtimg/ufdt_verify_overlay_host

      - name: Fix Overlay Host Tools
        run: |
          chmod +x tools/mkdtimg/ufdt_apply_overlay
          chmod +x tools/mkdtimg/ufdt_verify_overlay_host

          echo "===== libc++ ====="
          ls -lh /lib/x86_64-linux-gnu/libc++* || true
          ls -lh /usr/lib/x86_64-linux-gnu/libc++* || true

          echo "===== ufdt_verify_overlay_host ====="
          file tools/mkdtimg/ufdt_verify_overlay_host

          echo "===== NEEDED LIBRARIES ====="
          ldd tools/mkdtimg/ufdt_verify_overlay_host || true

      - name: Fix libc++ Runtime
        run: |
          set -e

          mkdir -p "${GITHUB_WORKSPACE}/tools/mkdtimg/lib"

          echo "===== SYSTEM libc++.so ====="
          ls -lh /usr/lib/llvm-14/lib/libc++.so
          file /usr/lib/llvm-14/lib/libc++.so

          echo "===== REAL libc++ RUNTIME ====="
          ls -lh /usr/lib/llvm-14/lib/libc++.so.1.0
          file /usr/lib/llvm-14/lib/libc++.so.1.0

          echo "===== INSTALL LOCAL RUNTIME ====="
          cp -L \
            /usr/lib/llvm-14/lib/libc++.so.1.0 \
            "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/libc++.so"

          cp -L \
            /usr/lib/llvm-14/lib/libc++abi.so.1.0 \
            "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/libc++abi.so.1"

          chmod 755 "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/libc++.so"
          chmod 755 "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/libc++abi.so.1"

          echo "===== LOCAL LIBRARIES ====="
          ls -lh "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/"
          file "${GITHUB_WORKSPACE}/tools/mkdtimg/lib/"*

          echo "===== TEST ufdt_verify_overlay_host ====="
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/tools/mkdtimg/lib:/usr/lib/llvm-14/lib" \
            "${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_verify_overlay_host" \
            2>&1 || true

      - name: Build DTBS
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/tools/mkdtimg/lib:/usr/lib/llvm-14/lib:${LD_LIBRARY_PATH}"

          make -j2 V=1 O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            HOSTCC=gcc \
            BSP_BUILD_FAMILY=sharkl3 \
            BSP_BUILD_ANDROID_OS=y \
            BSP_BUILD_DT_OVERLAY=y \
            DTC_OVERLAY_TEST_EXT="${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_apply_overlay" \
            DTC_OVERLAY_VTS_EXT="${GITHUB_WORKSPACE}/tools/mkdtimg/ufdt_verify_overlay_host" \
            dtbs

      - name: Inspect DTBO Board IDs
        run: |
          echo "===== DTBO BOARD IDS ====="

          for f in out/arch/arm64/boot/dts/sprd/m168-overlay*.dtbo; do
            echo
            echo "===== $f ====="

            dtc -I dtb -O dts "$f" 2>/dev/null | \
              grep -E 'sprd,board_id|bootargs_ext|compatible' || true
          done

      - name: Prepare DTBO Image
        run: |
          set -e

          mkdir -p dtbo_build

          cp out/arch/arm64/boot/dts/sprd/m168-overlay-pvt.dtbo \
            dtbo_build/0x1900.dtbo

          cp out/arch/arm64/boot/dts/sprd/m168-overlay-evt.dtbo \
            dtbo_build/0x1901.dtbo

          cp out/arch/arm64/boot/dts/sprd/m168-overlay-dvt.dtbo \
            dtbo_build/0x1902.dtbo

          cp out/arch/arm64/boot/dts/sprd/m168-overlay.dtbo \
            dtbo_build/0x1903.dtbo

          echo "===== DTBO INPUT ====="
          ls -lh dtbo_build/

      - name: Collect DTBS
        run: |
          mkdir -p dtbs_output

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp --parents {} dtbs_output/ \;

          echo "===== GENERATED DTBS ====="
          find dtbs_output -type f | sort

      - name: Upload DTBS
        uses: actions/upload-artifact@v4
        with:
          name: DTBS
          path: |
            dtbs_output/
            dtbo_build/
