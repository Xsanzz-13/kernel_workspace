name: Membangun DTBS

on:
  workflow_dispatch:

jobs:
  build-dtbs:
    runs-on: ubuntu-22.04

    steps:
      - name: Periksa Sumber Kernel
        uses: actions/checkout@v4

      - name: Instal Dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3-minimal \
            python2 \
            git \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            libyaml-dev \
            pkg-config \
            device-tree-compiler

          echo "=== YAML CHECK ==="
          pkg-config --modversion yaml-0.1
          pkg-config --cflags yaml-0.1
          pkg-config --libs yaml-0.1
          ldconfig -p | grep libyaml

      - name: Perbaiki Linker DTC
        run: |
          sed -i '/HOSTLDLIBS_dtc/ s/=.*/= -lyaml/' scripts/dtc/Makefile

          echo "=== DTC MAKEFILE ==="
          grep -n "HOSTLDLIBS_dtc" scripts/dtc/Makefile

      - name: Gunakan Toolchain dari Repository
        run: |
          echo "${{ github.workspace }}/toolchain/clang-r383902/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchain/aarch64-linux-android-4.9/bin" >> "$GITHUB_PATH"

      - name: Periksa Toolchain
        run: |
          clang --version
          aarch64-linux-android-gcc --version

      - name: Hasilkan Konfigurasi Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            a3core_eur_open_defconfig

      - name: Membangun DTBS
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            dtbs

      - name: Kumpulkan DTBS
        run: |
          mkdir -p output_artifacts

          find out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec cp {} output_artifacts/ \;

      - name: Unggah DTBS
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-DTBS
          path: output_artifacts/*