name: Build Kernel - Proton Clang

on:
  workflow_dispatch:

jobs:
  kernel-compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Inspect KernelSU Source
        run: |
          echo "===== KernelSU directory ====="
          ls -la KernelSU || true
          ls -la KernelSU/kernel || true

          echo ""
          echo "===== KernelSU git info ====="
          if [ -d KernelSU ]; then
            cd KernelSU
            git remote -v || true
            git log -1 --oneline || true
            git status --short || true
            cd ..
          fi

      - name: Ubah Default Shell ke Bash
        run: |
          sudo ln -sf /bin/bash /bin/sh

      # ==========================================
      # CACHE PROTON CLANG
      # ==========================================
      - name: Cache Proton Clang
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download/proton-clang
          key: proton-clang-master-ubuntu22-v1
          restore-keys: |
            proton-clang-master-ubuntu22-

      - name: Inspect Proton Clang
        run: |
          PROTON_DIR="${{ github.workspace }}/toolchain_download/proton-clang"

          echo "===== Proton directory ====="
          ls -lah "$PROTON_DIR"

          echo "===== bin ====="
          ls -lah "$PROTON_DIR/bin" | head -100

          echo "===== AArch64 tools ====="
          find "$PROTON_DIR/bin" -maxdepth 1 \
          -type f -name 'aarch64-linux-gnu-*' -printf '%f\n' | sort

          echo "===== ARM32 tools ====="
          find "$PROTON_DIR/bin" -maxdepth 1 \
          -type f -name 'arm-linux-gnueabi-*' -printf '%f\n' | sort

          echo "===== Compiler ====="
          "$PROTON_DIR/bin/clang" --version | head -5

          echo "===== LLVM tools ====="
          "$PROTON_DIR/bin/ld.lld" --version | head -2
          "$PROTON_DIR/bin/llvm-ar" --version | head -2
          "$PROTON_DIR/bin/llvm-nm" --version | head -2    

      # ==========================================
      # CACHE APT
      # ==========================================
      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: apt-ubuntu-22.04-v1
          restore-keys: |
            apt-ubuntu-22.04-

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install Dependencies Sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache \
            python3-minimal \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            libncurses-dev \
            libyaml-dev \
            tar

      # ==========================================
      # BUILD
      # ==========================================
      - name: Eksekusi Kompilasi Kernel Proton Clang
        run: |
          chmod +x b-proton.sh
          ./b-proton.sh

      # ==========================================
      # ARTIFACT
      # ==========================================
      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kernel-ProtonClang
          path: ${{ github.workspace }}/output_artifacts_proton/*
