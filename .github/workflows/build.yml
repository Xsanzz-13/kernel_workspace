
name: Build Kernel Otomatis

on:
  workflow_dispatch:

jobs:
  kernel-compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Setup SukiSU Ultra Builtin
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s 496837ad81b9332d352b0b17184a0d637c81b7cc
          test -f KernelSU/kernel/Kconfig
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          grep -q ksu_handle_execveat fs/exec.c
          grep -q ksu_handle_faccessat fs/open.c
          grep -q ksu_handle_stat fs/stat.c
          grep -q ksu_handle_vfs_read fs/read_write.c

      - name: Audit Definisi Versi dan API SukiSU
        run: |
          set -eu

          echo "===== VERSION / API DEFINITIONS ====="
          git -C KernelSU grep -n -i -E \
            'uapi|minimal_supported_kernel|kernel_su_version|version_code|version_name|ksu_version|manager.*version|KSU_VERSION_API|KSU_VERSION_FULL' \
            HEAD -- ':!*.lock' || true

          echo
          echo "===== VERSION AND UAPI FILES ====="
          find KernelSU -type f \
            \( -iname '*version*' -o -iname '*uapi*' -o -name 'Natives.kt' -o -name 'ksu.h' \) \
            -print | head -200

          echo
          echo "===== KBUILD VERSION LOGIC ====="
          sed -n '28,95p' KernelSU/kernel/Kbuild

          echo
          echo "===== MANAGER VERSION INFO INTERFACE ====="
          sed -n '1,100p' KernelSU/kernel/supercalls.h
          sed -n '75,115p' KernelSU/kernel/supercalls.c

          echo
          echo "===== SUKISU COMMIT ====="
          git -C KernelSU show -s \
            --format='commit=%H%nsubject=%s%ndate=%cI' HEAD

      - name: Ubah Default Shell ke Bash
        run: |
          sudo ln -sf /bin/bash /bin/sh

      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: toolchain-ubuntu22-clang-r383902b-gcc-14.3-v1
          restore-keys: |
            toolchain-ubuntu22-

      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: apt-ubuntu-22.04-v1
          restore-keys: |
            toolchain-ubuntu22-

      - name: Install Dependencies Sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache \
            python3-minimal \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            libyaml-dev \
            tar

      - name: Eksekusi Kompilasi Kernel
        run: |
          chmod +x b.sh
          ./b.sh

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kernel-Sprd
          path: ${{ github.workspace }}/output_artifacts/*
          
