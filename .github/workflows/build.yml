name: Build Kernel Otomatis

on:
  workflow_dispatch:

jobs:
  kernel-compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Inspect KernelSU Source
        run: |
          echo "===== KernelSU directory ====="
          ls -la KernelSU || true
          ls -la KernelSU/kernel || true

          echo ""
          echo "===== KernelSU git info ====="
          cd KernelSU
          git remote -v || true
          git log -1 --oneline || true
          git status --short || true
          cd ..

          echo ""
          echo "===== KernelSU kernel files ====="
          find KernelSU/kernel -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "===== KernelSU Kconfig ====="
          sed -n '1,240p' KernelSU/kernel/Kconfig 2>/dev/null || true

          echo ""
          echo "===== KernelSU Makefile ====="
          sed -n '1,200p' KernelSU/kernel/Makefile 2>/dev/null || true
          
      - name: Ubah Default Shell ke Bash
        run: |
          sudo ln -sf /bin/bash /bin/sh

      # ================================
      # CACHE TOOLCHAIN
      # ================================
      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: toolchain-ubuntu22-clang-r383902b-gcc-14.3-v1
          restore-keys: |
            toolchain-ubuntu22-

      # ================================
      # CACHE APT
      # ================================
      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: apt-ubuntu-22.04-v1
          restore-keys: |
            apt-ubuntu-22.04-

      - name: Install Dependencies Sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache \
            python3-minimal \
            python2 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            gcc-aarch64-linux-gnu \
            libncurses-dev \
            libyaml-dev \
            tar

      - name: Eksekusi Kompilasi Kernel
        run: |
          chmod +x b.sh
          ./b.sh

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kernel-Sprd
          path: ${{ github.workspace }}/output_artifacts/*
